# Codemagic CI/CD config for Little Steps (React Native CLI 0.76.5)
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/

workflows:
  # ---------------------------------------------------------------------------
  # Android RELEASE APK — FREE to build and install on any Android device.
  #
  # Why release (not debug): a debug APK does NOT embed the JS bundle and needs
  # a Metro dev server, so it shows a red error screen when installed standalone.
  # The release APK bundles the JS (+ Hermes) and is signed with the committed
  # debug keystore, so it runs on a phone with no Metro and no $99 account.
  #
  # NOTE: Codemagic's free 500 min/month are macOS-M2 only — Linux/Windows
  # builds have no free minutes, so we build the Android APK on a Mac instance.
  # ---------------------------------------------------------------------------
  android-release:
    name: Android Release APK (free, installable)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: 20.11.0
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.npm
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build Android release APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk

  # ---------------------------------------------------------------------------
  # iOS build — requires a paid Apple Developer account ($99/yr) for code
  # signing and TestFlight/device install. Left here for when you're ready.
  # You'll need to add code signing in Codemagic (App Store Connect integration)
  # before this can install on a real iPhone.
  # ---------------------------------------------------------------------------
  ios-release:
    name: iOS (needs Apple Developer account)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: 20.11.0
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.npm
        - ios/Pods
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Build iOS (unsigned archive)
        script: |
          xcode-project build-ipa \
            --workspace "ios/LittleSteps.xcworkspace" \
            --scheme "LittleSteps"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
